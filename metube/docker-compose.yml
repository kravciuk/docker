services:
  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    networks:
      - web

    ports:
      - "8110:8081"

    volumes:
      - /mnt/sda1/samba/youtube:/downloads

    user: "1000:1000"

networks:
  web:
    name: web
    external: true
