worker_processes auto;
events {
    worker_connections 1024;
}

http {

    client_max_body_size 12000M;
    proxy_headers_hash_max_size 512;
    proxy_headers_hash_bucket_size 128;

    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"host":"$host",'
        '"remote_addr":"$remote_addr",'
        '"http_cf_connecting_ip":"$http_cf_connecting_ip",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
        '}';

    # DNS Docker: нужен для `resolve` в upstreams.cfg и для ACME
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /var/log/angie/access.log json_combined;
    error_log /var/log/angie/error.log;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/angie/html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
    
    include conf.d/system/country_block.cfg;
    include conf.d/system/upstreams.cfg;
    include conf.d/*.conf;
}
