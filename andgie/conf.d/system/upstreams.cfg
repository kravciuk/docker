# Docker-бэкенды. `resolve` + resolver в angie.conf: Angie сам перечитывает IP
# контейнера, поэтому пересоздание контейнера не ломает прокси (без reload).
# В vhost'ах: proxy_pass http://<имя upstream>;  (без порта)

upstream victorialogs {
    zone victorialogs 64k;
    server victorialogs:9428 resolve;
}

upstream rustrak {
    zone rustrak 64k;
    server rustrak:8080 resolve;
}

upstream authentik-server-1 {
    zone authentik-server-1 64k;
    server authentik-server-1:9000 resolve;
}

upstream startpage-prod {
    zone startpage-prod 64k;
    server startpage-prod:7774 resolve;
}

upstream nextcloud {
    zone nextcloud 64k;
    server nextcloud:80 resolve;
}

upstream couchdb {
    zone couchdb 64k;
    server couchdb:5984 resolve;
}

upstream drawio {
    zone drawio 64k;
    server drawio:8080 resolve;
}

upstream maildev {
    zone maildev 64k;
    server maildev:1080 resolve;
}

upstream jellyfin {
    zone jellyfin 64k;
    server jellyfin:8096 resolve;
}

upstream qbit {
    zone qbit 64k;
    server qbit:8080 resolve;
}

upstream uptime-kuma {
    zone uptime-kuma 64k;
    server uptime-kuma:3001 resolve;
}

upstream vaultwarden {
    zone vaultwarden 64k;
    server vaultwarden:80 resolve;
}
