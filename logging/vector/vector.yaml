data_dir: /var/lib/vector

sources:
  angie_access:
    type: file
    include:
      - /var/log/nginx/access.log
    read_from: end

  angie_error:
    type: file
    include:
      - /var/log/nginx/error.log
    read_from: end

  # Логи локальных проектов (django-structlog, JSON, одна запись на строку):
  # /var/log/local/<project>/*.log
  # Проект добавляется одной строкой volume в docker-compose.yml:
  #   - /www/<project>/var/logs:/var/log/local/<project>:ro
  # В VictoriaLogs container_name будет "local.<project>".
  local_django:
    type: file
    include:
      - /var/log/local/*/*.log
    read_from: end

  docker:
    type: docker_logs
    exclude_containers:
      - vector
      - angie

  vector_metrics:
    type: internal_metrics

transforms:
  angie_access_parsed:
    type: remap
    inputs:
      - angie_access
    source: |
      parsed, err = parse_json(.message)
      if err == null {
        . = merge!(., parsed)
      }

      ts, terr = parse_timestamp(.time, format: "%+")
      if terr == null {
        .timestamp = ts
      } else {
        .timestamp = now()
      }

      if exists(.request) {
        .message = .request
      }

      .source = "angie-access"
      .container_name = "angie"
      del(.file)

  angie_error_parsed:
    type: remap
    inputs:
      - angie_error
    source: |
      parsed, err = parse_regex(.message, r'^(?P<ts>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<msg>.*)$')
      if err == null {
        .level = parsed.level
        .message = parsed.msg

        ts, terr = parse_timestamp(parsed.ts, format: "%Y/%m/%d %H:%M:%S")
        if terr == null {
          .timestamp = ts
        }
      }

      if !exists(.timestamp) {
        .timestamp = now()
      }

      .source = "angie-error"
      .container_name = "angie"
      del(.file)

  local_django_parsed:
    type: remap
    inputs:
      - local_django
    source: |
      # .file = /var/log/local/<project>/<name>.log
      path_parts, perr = parse_regex(.file, r'^/var/log/local/(?P<project>[^/]+)/(?P<name>[^/]+)$')
      if perr == null {
        .container_name = "local." + string!(path_parts.project)
        .log_file = path_parts.name
      } else {
        .container_name = "local.unknown"
      }
      del(.file)

      # django-structlog: одна JSON-запись на строку
      # (event, level, logger, timestamp, filename, lineno, request_id, user_id, ip, ...)
      raw = string!(.message)
      parsed, err = parse_json(raw)
      if err == null && is_object(parsed) {
        . = merge!(., parsed)
        if exists(.event) {
          .message = .event
          del(.event)
        }
      } else {
        # не JSON (traceback без форматтера, print и т.п.) — оставляем как есть
        .message = raw
      }

      ts, terr = parse_timestamp(.timestamp, format: "%+")
      if terr == null {
        .timestamp = ts
      } else {
        .timestamp = now()
      }

      .source = "django"

  docker_parsed:
    type: remap
    inputs:
      - docker
    source: |
      # Если контейнер (например Django с python-json-logger) пишет в stdout
      # готовый JSON — разбираем его поля. Иначе оставляем message как есть.
      parsed, err = parse_json(.message)
      if err == null {
        . = merge!(., parsed)
      }

      .source = "docker"

sinks:
  victorialogs:
    type: http
    inputs:
      - angie_access_parsed
      - angie_error_parsed
      - local_django_parsed
      - docker_parsed
    uri: "http://victorialogs:9428/insert/jsonline?_stream_fields=source,container_name&_msg_field=message&_time_field=timestamp"
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    healthcheck:
      enabled: false

  prom_exporter:
    type: prometheus_exporter
    inputs:
      - vector_metrics
    address: "0.0.0.0:9598"
