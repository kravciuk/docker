services:

  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    restart: unless-stopped

    ports:
      - "8132:9428"

    volumes:
      - ./victorialogs:/victoria-logs-data

    command:
      - "-storageDataPath=/victoria-logs-data"


  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped

    ports:
      - "8131:8428"

    volumes:
      - ./victoriametrics:/victoria-metrics-data

    command:
      - "-storageDataPath=/victoria-metrics-data"


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "8130:3000"

    volumes:
      - ./grafana:/var/lib/grafana

    depends_on:
      - victorialogs
      - victoriametrics


  vector:
    image: timberio/vector:0.58.0-alpine
    container_name: vector
    restart: unless-stopped

    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./vector-data:/var/lib/vector
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/nginx:/var/log/nginx:ro

    depends_on:
      - victorialogs


  vmagent:
    image: victoriametrics/vmagent:v1.152.0
    container_name: vmagent
    restart: unless-stopped

    volumes:
      - ./vmagent/scrape.yml:/etc/vmagent/scrape.yml:ro
      - ./vmagent-data:/vmagent-data

    command:
      - "-promscrape.config=/etc/vmagent/scrape.yml"
      - "-remoteWrite.url=http://victoriametrics:8428/api/v1/write"
      - "-remoteWrite.tmpDataPath=/vmagent-data"

    depends_on:
      - victoriametrics
