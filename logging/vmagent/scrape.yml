global:
  scrape_interval: 30s

scrape_configs:
  - job_name: victorialogs
    static_configs:
      - targets: ["victorialogs:9428"]

  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]

  - job_name: vmagent
    static_configs:
      - targets: ["localhost:8429"]

  - job_name: vector
    static_configs:
      - targets: ["vector:9598"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
